
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  index.html: |
    <!doctype html>
    <html>
      <body>
        <h1>Pathnex NGINX Application</h1>
        <p>Deployed using Kubernetes ConfigMap.</p>
      </body>
    </html>
---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secret
type: Opaque
stringData:
  password: "replace-with-practice-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathnex-nginx
  template:
    metadata:
      labels:
        app: pathnex-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-secret-volume
              mountPath: /etc/pathnex-secret
              readOnly: true
      volumes:
        - name: nginx-content
          configMap:
            name: nginx-config
        - name: nginx-secret-volume
          secret:
            secretName: nginx-secret
