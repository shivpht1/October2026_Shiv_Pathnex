
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-web-app
  labels:
    app: pathnex-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pathnex-web-app
  template:
    metadata:
      labels:
        app: pathnex-web-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pathnex-web-service
spec:
  type: ClusterIP
  selector:
    app: pathnex-web-app
  ports:
    - port: 80
      targetPort: 80
