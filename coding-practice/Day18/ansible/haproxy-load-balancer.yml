cat > coding-practice/Day18/ansible/haproxy-load-balancer.yml <<'EOF'
---
- name: Configure HAProxy Load Balancer
  hosts: load_balancers
  become: true

  tasks:
    - name: Install HAProxy
      ansible.builtin.package:
        name: haproxy
        state: present

    - name: Configure HAProxy
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
      notify: Restart HAProxy

    - name: Ensure HAProxy is enabled and running
      ansible.builtin.service:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Restart HAProxy
      ansible.builtin.service:
        name: haproxy
        state: restarted
EOF