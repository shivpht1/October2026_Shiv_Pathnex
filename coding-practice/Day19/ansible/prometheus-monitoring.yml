
cat > coding-practice/Day19/ansible/prometheus-monitoring.yml <<'EOF'
---
- name: Setup Prometheus Monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Prometheus and Node Exporter
      ansible.builtin.package:
        name:
          - prometheus
          - prometheus-node-exporter
        state: present

    - name: Start and enable Prometheus
      ansible.builtin.service:
        name: prometheus
        state: started
        enabled: true

    - name: Start and enable Node Exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
EOF
