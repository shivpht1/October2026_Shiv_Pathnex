
cat > coding-practice/Day19/gitlab/.gitlab-ci.yml <<'EOF'
stages:
  - build
  - push
  - deploy
  - verify

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

build_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - docker info
    - docker build -t "$CI_REGISTRY_IMAGE/pathnex-flask:$IMAGE_TAG" coding-practice/Day19/docker
    - docker save "$CI_REGISTRY_IMAGE/pathnex-flask:$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

push_image:
  stage: push
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  dependencies:
    - build_image
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$CI_REGISTRY_IMAGE/pathnex-flask:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_logging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply --dry-run=client -f coding-practice/Day19/kubernetes/fluentd-logging.yaml
    - kubectl apply -f coding-practice/Day19/kubernetes/fluentd-logging.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify_logging:
  stage: verify
  image: bitnami/kubectl:latest
  script:
    - kubectl rollout status deployment/fluentd --timeout=120s
    - kubectl get pods
    - kubectl get services
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
EOF
