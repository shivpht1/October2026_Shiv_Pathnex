
cat > coding-practice/Day20/gitlab/.gitlab-ci.yml <<'EOF'
stages:
  - build
  - push
  - deploy
  - verify

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/pathnex-web-app:$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

build_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - docker info
    - docker build -t "$IMAGE_NAME" coding-practice/Day20/docker
    - docker save "$IMAGE_NAME" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

push_image:
  stage: push
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  dependencies:
    - build_image
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_rbac:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl apply --dry-run=client -f coding-practice/Day20/kubernetes/rbac-configuration.yaml
    - kubectl apply -f coding-practice/Day20/kubernetes/rbac-configuration.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify_rbac:
  stage: verify
  image: bitnami/kubectl:latest
  script:
    - kubectl get namespace pathnex-dev
    - kubectl get role,rolebinding -n pathnex-dev
    - kubectl auth can-i list pods --as=system:serviceaccount:pathnex-dev:pathnex-viewer -n pathnex-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
EOF
