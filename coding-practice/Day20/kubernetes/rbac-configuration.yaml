
cat > coding-practice/Day20/kubernetes/rbac-configuration.yaml <<'EOF'
apiVersion: v1
kind: Namespace
metadata:
  name: pathnex-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pathnex-viewer
  namespace: pathnex-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-viewer
  namespace: pathnex-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-viewer-binding
  namespace: pathnex-dev
subjects:
  - kind: ServiceAccount
    name: pathnex-viewer
    namespace: pathnex-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-viewer
EOF
