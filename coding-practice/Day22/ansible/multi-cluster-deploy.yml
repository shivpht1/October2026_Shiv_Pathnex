cat > coding-practice/Day22/ansible/multi-cluster-deploy.yml <<'EOF'
---
- name: Deploy Nginx across multiple Kubernetes clusters
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Deploy Nginx on US East cluster
      ansible.builtin.command:
        argv:
          - kubectl
          - --context=us-east-cluster
          - apply
          - -f
          - coding-practice/Day22/kubernetes/deployment.yaml
      changed_when: true

    - name: Deploy Nginx on US West cluster
      ansible.builtin.command:
        argv:
          - kubectl
          - --context=us-west-cluster
          - apply
          - -f
          - coding-practice/Day22/kubernetes/deployment.yaml
      changed_when: true
EOF