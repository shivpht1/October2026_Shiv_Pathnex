cat > coding-practice/Day24/kubernetes/deployment.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-web-app
  labels:
    app: pathnex-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pathnex-web-app
  template:
    metadata:
      labels:
        app: pathnex-web-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
EOF