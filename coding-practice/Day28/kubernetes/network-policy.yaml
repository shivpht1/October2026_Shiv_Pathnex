cat > coding-practice/Day28/kubernetes/network-policy.yaml <<'EOF'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pathnex-vpc-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: pathnex-app

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pathnex-db
EOF