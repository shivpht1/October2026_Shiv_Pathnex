cat > coding-practice/Day29/ansible/deploy-stack.yml <<'EOF'
---
- name: Complete Deployment Setup
  hosts: all
  become: true
  tasks:
    - name: Ensure Docker Compose is available
      command: docker compose version
      changed_when: false

    - name: Deploy Nginx, MySQL, and Redis
      command:
        argv:
          - docker
          - compose
          - -f
          - /opt/pathnex/docker-compose.yml
          - up
          - -d
EOF