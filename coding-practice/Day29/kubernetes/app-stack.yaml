cat > coding-practice/Day29/kubernetes/app-stack.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-app
  labels:
    app: pathnex-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathnex-app
  template:
    metadata:
      labels:
        app: pathnex-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pathnex-service
spec:
  type: ClusterIP
  selector:
    app: pathnex-app
  ports:
    - port: 80
      targetPort: 80
EOF